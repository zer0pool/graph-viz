services:
  lineage-manager:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "5003:5003"
    volumes:
      - ./apps/lineage_manager:/app/src/lineage_manager
    environment:
      - PORT=5003
      - PYTHONPATH=/app/src
    restart: unless-stopped
    container_name: lineage-manager-backend
