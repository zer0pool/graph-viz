name: admin-console

services:
  # --- Infrastructure ---
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_DATABASE: lineage_manager_v2
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "33307:3306"
    volumes:
      - mysql_v2_data:/var/lib/mysql
    networks:
      - lineage-platform-network

  redis-cache:
    image: redis:alpine
    container_name: redis-cache
    ports:
      - "6379:6379"
    networks:
      - lineage-platform-network

  # --- Lineage Backend ---
  lineage-api:
    build:
      context: ./apps/backend/lineage_manager_v2
      dockerfile: deploy/docker/Dockerfile
    image: admin-console/lineage-api
    container_name: lineage-api
    ports:
      - "5003:5003"
    env_file:
      - ./apps/backend/lineage_manager_v2/.env
    environment:
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - REDIS_HOST=redis-cache
      - REDIS_PORT=6379
      - JOB_MANAGER_URL=http://job-dummy:9000
      - ROOT_PATH=/admin-console/lineage-manager
    depends_on:
      - mysql-db
      - redis-cache
      - job-dummy
    networks:
      - lineage-platform-network

  lineage-worker:
    build:
      context: ./apps/backend/lineage_manager_v2
      dockerfile: deploy/docker/Dockerfile
    image: admin-console/lineage-worker
    container_name: lineage-worker
    command: celery
    env_file:
      - ./apps/backend/lineage_manager_v2/.env
    environment:
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - REDIS_HOST=redis-cache
      - REDIS_PORT=6379
      - JOB_MANAGER_URL=http://job-dummy:9000
    depends_on:
      - mysql-db
      - redis-cache
      - job-dummy
    networks:
      - lineage-platform-network

  # --- Analytics Backend ---
  analytics-api:
    build:
      context: ./apps/backend/analytics_manager
      dockerfile: deploy/docker/Dockerfile
    image: admin-console/analytics-api
    container_name: analytics-api
    ports:
      - "5004:5004"
    env_file:
      - ./apps/backend/analytics_manager/.env
    environment:
      - REDIS_HOST=redis-cache
      - REDIS_PORT=6379
      - ROOT_PATH=/admin-console/analytics-manager
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
    volumes:
      - ~/.config/gcloud:/root/.config/gcloud:ro
    depends_on:
      - redis-cache
    networks:
      - lineage-platform-network

  # --- Dummy Services ---
  job-dummy:
    build:
      context: ./apps/backend/dummy-job-manager
      dockerfile: Dockerfile
    image: admin-console/job-dummy
    container_name: job-dummy
    ports:
      - "9000:9000"
    volumes:
      - ./apps/backend/dummy-job-manager:/app/data:ro
    networks:
      - lineage-platform-network

  # --- Frontend Services ---
  shell:
    build:
      context: ./apps/frontend/container
      dockerfile: deploy/docker/Dockerfile
      args:
        - LINEAGE_MFE_URL=/admin-console/mfe-lineage/remoteEntry.js
        - CATALOG_MFE_URL=/admin-console/mfe-catalog/remoteEntry.js
    image: admin-console/shell
    container_name: shell
    ports:
      - "5100:80"
    environment:
      - API_BASE_URL=/admin-console
      - BASE_URL=/admin-console
      - BACKEND_HOST=http://lineage-api:5003
      - ANALYTICS_MANAGER_UPSTREAM=http://analytics-api:5004
      - MFE_LINEAGE_UPSTREAM=http://ui-lineage:80
      - MFE_CATALOG_UPSTREAM=http://ui-catalog:80
      - NODE_ENV=production
    depends_on:
      - ui-lineage
      - ui-catalog
      - lineage-api
    networks:
      - lineage-platform-network

  ui-lineage:
    build:
      context: ./apps/frontend/mfe-lineage
      dockerfile: deploy/docker/Dockerfile
    image: admin-console/ui-lineage
    container_name: ui-lineage
    ports:
      - "5101:80"
    environment:
      - API_BASE_URL=/admin-console
      - BASE_URL=/admin-console/mfe-lineage
      - BACKEND_HOST=http://lineage-api:5003
    networks:
      - lineage-platform-network

  ui-catalog:
    build:
      context: ./apps/frontend/mfe-catalog
      dockerfile: deploy/docker/Dockerfile
    image: admin-console/ui-catalog
    container_name: ui-catalog
    ports:
      - "5102:80"
    environment:
      - API_BASE_URL=/admin-console
      - BASE_URL=/admin-console/mfe-catalog
      - BACKEND_HOST=http://lineage-api:5003
    networks:
      - lineage-platform-network

networks:
  lineage-platform-network:
    driver: bridge

volumes:
  mysql_v2_data:
