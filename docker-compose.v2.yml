services:
  lineage-manager-v2:
    build:
      context: ./apps/lineage-manager-v2
      dockerfile: Dockerfile
    container_name: lineage-manager-v2
    ports:
      - "5004:5004"
    env_file:
      - ./apps/lineage-manager-v2/.env
    environment:
      - DATABASE_URL=mysql+aiomysql://root:root123@db-mysql-v2:3306/lineage_v2
    depends_on:
      - db-mysql-v2
    networks:
      - lineage-v2-network

  db-mysql-v2:
    image: mysql:8.0
    container_name: db-mysql-v2
    environment:
      MYSQL_DATABASE: lineage_v2
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "33307:3306" # Different from V1 (33306)
    volumes:
      - mysql_v2_data:/var/lib/mysql
    networks:
      - lineage-v2-network

networks:
  lineage-v2-network:
    driver: bridge

volumes:
  mysql_v2_data:
