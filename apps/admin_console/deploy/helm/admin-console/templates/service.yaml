{{- range $app := list "app" "mfeLineage" "mfeCatalog" }}
{{- $config := index $.Values $app }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $config.name }}
  labels:
    app: {{ $config.name }}
    chart: {{ $.Chart.Name }}-{{ $.Chart.Version }}
    release: {{ $.Release.Name }}
  annotations:
    {{- if $.Values.backendConfig.enabled }}
    cloud.google.com/backend-config: '{"default": "{{ $.Values.backendConfig.name }}"}'
    {{- end }}
    # cloud.google.com/backend-config: '{"default": "self-scheduling-backend"}'
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: {{ $.Values.service.type }}
  ports:
    - port: {{ $.Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: {{ $config.name }}
{{- end }}
