# Default values for admin-console
replicaCount: 1

image:
  registry: docker.io
  pullPolicy: IfNotPresent
  tag: "latest"

# App (Shell) configuration
app:
  name: admin-console-app
  image: admin-console-app
  port: 5100
  basePath: /admin-console
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 200m
      memory: 256Mi

# MFE Lineage configuration
mfeLineage:
  name: admin-mfe-lineage
  image: admin-mfe-lineage
  port: 5101
  basePath: /mfe-lineage
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 200m
      memory: 256Mi

# MFE Catalog configuration
mfeCatalog:
  name: admin-mfe-catalog
  image: admin-mfe-catalog
  port: 5102
  basePath: /mfe-catalog
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Backend API configuration
backend:
  url: http://lineage-manager.self-scheduling-dev1.svc.cluster.local:5003

# Ingress configuration
ingress:
  enabled: true
  className: gce
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.global-static-ip-name: "self-scheduling"
  hosts:
    - host: dev1-self-scheduling.di.atlas.samsung.com
      paths:
        - path: /admin-console
          pathType: Prefix
          service: admin-console-app
        - path: /mfe-lineage
          pathType: Prefix
          service: admin-mfe-lineage
        - path: /mfe-catalog
          pathType: Prefix
          service: admin-mfe-catalog
  tls:
    - secretName: admin-console-tls
      hosts:
        - dev1-self-scheduling.di.atlas.samsung.com

# Service configuration
service:
  type: ClusterIP
  port: 80

# BackendConfig configuratino for Google Cloud Load Balacer
backendConfig:
  enabled: true
  name: self-scheduling-backend
  timeoutSec: 30
  connectionDraining:
    drainingTimeoutSec: 300
  healthCheck:
    checkIntervalSec: 5
    timeoutSec: 5
    healthyThreshold: 2
    unhealthyThreshold: 2
    type: HTTP
    requestPath: /health
    port: 80

# Environment-specific overrides
env: dev

nodeSelector: {}
tolerations: []
affinity: {}
