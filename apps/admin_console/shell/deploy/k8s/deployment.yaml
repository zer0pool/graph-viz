apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-console-shell
  labels:
    app: admin-console-shell
spec:
  replicas: 2
  selector:
    matchLabels:
      app: admin-console-shell
  template:
    metadata:
      labels:
        app: admin-console-shell
    spec:
      containers:
        - name: shell
          image: admin-console-shell:latest
          ports:
            - containerPort: 80
          env:
            - name: API_BASE_URL
              value: "http://lineage-manager:5003"
---
apiVersion: v1
kind: Service
metadata:
  name: admin-console-shell
spec:
  selector:
    app: admin-console-shell
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
