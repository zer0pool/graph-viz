apiVersion: v1
kind: Service
metadata:
  name: { { include "admin-console-shell.fullname" . } }
  labels: { { - include "admin-context-shell.labels" . | nindent 4 } }
spec:
  type: { { .Values.service.type } }
  ports:
    - port: { { .Values.service.port } }
      targetPort: 80
      protocol: TCP
      name: http
  selector: { { - include "admin-console-shell.selectorLabels" . | nindent 4 } }
