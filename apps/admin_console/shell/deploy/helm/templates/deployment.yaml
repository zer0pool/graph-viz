apiVersion: apps/v1
kind: Deployment
metadata:
  name: { { include "admin-console-shell.fullname" . } }
  labels: { { - include "admin-console-shell.labels" . | nindent 4 } }
spec:
  replicas: { { .Values.replicaCount } }
  selector:
    matchLabels:
      { { - include "admin-console-shell.selectorLabels" . | nindent 6 } }
  template:
    metadata:
      labels:
        { { - include "admin-console-shell.selectorLabels" . | nindent 8 } }
    spec:
      containers:
        - name: { { .Chart.Name } }
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: { { .Values.image.pullPolicy } }
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: API_BASE_URL
              value: { { .Values.env.apiBaseUrl | quote } }
          resources: { { - toYaml .Values.resources | nindent 12 } }
