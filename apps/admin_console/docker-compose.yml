services:
  admin-console-app:
    build:
      context: ./container
      dockerfile: deploy/docker/Dockerfile
      args:
        - LINEAGE_MFE_URL=http://localhost:5101/mfe-lineage/remoteEntry.js
        - CATALOG_MFE_URL=http://localhost:5102/mfe-catalog/remoteEntry.js
    container_name: admin-console-app
    ports:
      - "${SHELL_PORT:-5100}:80"
    environment:
      - API_BASE_URL=/admin-console
      - BASE_URL=${BASE_URL:-/admin-console}
      - BACKEND_HOST=http://lineage-manager:5003
      - LINEAGE_MFE_URL=/admin-console/mfe-lineage/remoteEntry.js
      - CATALOG_MFE_URL=/admin-console/mfe-catalog/remoteEntry.js
      - ENABLE_LINEAGE_MFE=${ENABLE_LINEAGE_MFE:-true}
      - ENABLE_CATALOG_MFE=${ENABLE_CATALOG_MFE:-true}
      - NODE_ENV=production
    networks:
      - admin-network
      - backend-network

  admin-mfe-lineage:
    build:
      context: ./mfe-lineage
      dockerfile: deploy/docker/Dockerfile
      args:
        - LINEAGE_MFE_URL=http://localhost:5101/mfe-lineage/remoteEntry.js
        - CATALOG_MFE_URL=http://localhost:5102/mfe-catalog/remoteEntry.js
    container_name: admin-mfe-lineage
    ports:
      - "${LINEAGE_PORT:-5101}:80"
    environment:
      - API_BASE_URL=/admin-console
      - BASE_URL=${LINEAGE_BASE_URL:-/mfe-lineage}
      - BACKEND_HOST=http://lineage-manager:5003
    networks:
      - admin-network
      - backend-network

  admin-mfe-catalog:
    build:
      context: ./mfe-catalog
      dockerfile: deploy/docker/Dockerfile
      args:
        - LINEAGE_MFE_URL=http://localhost:5101/mfe-lineage/remoteEntry.js
        - CATALOG_MFE_URL=http://localhost:5102/mfe-catalog/remoteEntry.js
    container_name: admin-mfe-catalog
    ports:
      - "${TABLE_DETAIL_PORT:-5102}:80"
    environment:
      - API_BASE_URL=/admin-console
      - BASE_URL=${CATALOG_BASE_URL:-/mfe-catalog}
      - BACKEND_HOST=http://lineage-manager:5003
    networks:
      - admin-network
      - backend-network

networks:
  admin-network:
    driver: bridge
  backend-network:
    external: true
    name: lineage-platform-network
