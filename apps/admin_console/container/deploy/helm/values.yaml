replicaCount: 1

image:
  repository: asia-northeast3-docker.pkg.dev/sec-bdp-user-dev/self-scheduling-dev1/admin-console-app
  pullPolicy: Always
  tag: "latest"

serviceAccount:
  create: false
  name: "self-scheduling"

namespace: "self-scheduling-dev1"

service:
  type: NodePort
  port: 5100
  targetPort: 80
  annotations:
    cloud.google.com/backend-config: '{"default": "self-scheduling-backend"}'
    cloud.google.com/neg: '{"ingress": true}'

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 200m
    memory: 256Mi

fullnameOverride: "admin-console-app"

env:
  API_BASE_URL: "/admin-console"
  BASE_URL: "/admin-console"
  BACKEND_HOST: "http://lineage-manager.self-scheduling-dev1.svc.cluster.local:5003"
  ENABLE_AUTH: "false"
  ENABLE_LINEAGE_MFE: "true"
  ENABLE_CATALOG_MFE: "true"
  LINEAGE_MFE_URL: "https://dev1-self-scheduling.di.atlas.samsung.com/admin-console/mfe-lineage/remoteEntry.js"
  CATALOG_MFE_URL: "https://dev1-self-scheduling.di.atlas.samsung.com/admin-console/mfe-catalog/remoteEntry.js"
  MFE_LINEAGE_UPSTREAM: "http://admin-mfe-lineage:5101"
  MFE_CATALOG_UPSTREAM: "http://admin-mfe-catalog:5102"
  API_LOCATION_REGEX: "^(/admin-console)?/api"
  NAMESERVER: "10.7.176.10"
  # OIDC Configuration (Override via --set or separate values file)
  OIDC_AUTHORITY: "https://sts.secsso.net/adfs"
  OIDC_CLIENT_ID: "b28275ba-2f7d-4313-9803-e9ead6489726"
  OIDC_CLIENT_SECRET: "5MqWt1KcELrtzJom"
  OIDC_REDIRECT_URI: "https://dev1-self-scheduling.di.atlas.samsung.com/admin-console/authorized"
  OIDC_SCOPE: "openid profile email"
  OIDC_RESPONSE_TYPE: "id_token"
  OIDC_RESPONSE_MODE: "fragment"
  OIDC_RESOURCE: ""
