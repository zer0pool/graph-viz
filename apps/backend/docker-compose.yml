
services:
  # --- Infrastructure ---
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_DATABASE: lineage_manager_v2
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "33307:3306"
    volumes:
      - mysql_v2_data:/var/lib/mysql
    networks:
      - admin-console-network

  redis-cache:
    image: redis:alpine
    container_name: redis-cache
    ports:
      - "6379:6379"
    networks:
      - admin-console-network

  # --- Lineage Backend ---
  lineage-api:
    build:
      context: ./lineage_manager_v2
      dockerfile: deploy/docker/Dockerfile
    image: admin-console/lineage-api
    container_name: lineage-api
    ports:
      - "5003:5003"
    env_file:
      - ./lineage_manager_v2/.env
    environment:
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - REDIS_HOST=redis-cache
      - REDIS_PORT=6379
      - JOB_MANAGER_URL=http://job-dummy:9000
      - ROOT_PATH=/admin-console/lineage-manager
      - CORS_ALLOWED_ORIGINS=["http://localhost:5100","http://127.0.0.1:5100","${EXTERNAL_CORS_ORIGIN:-http://localhost:5100}"]
      - SECRET_KEY=${SESSION_SECRET_KEY:-magic_word}
    depends_on:
      - mysql-db
      - redis-cache
      - job-dummy
    networks:
      - admin-console-network

  lineage-worker:
    build:
      context: ./lineage_manager_v2
      dockerfile: deploy/docker/Dockerfile
    image: admin-console/lineage-worker
    container_name: lineage-worker
    command: celery -Q lineage_v2
    env_file:
      - ./lineage_manager_v2/.env
    environment:
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - REDIS_HOST=redis-cache
      - REDIS_PORT=6379
      - JOB_MANAGER_URL=http://job-dummy:9000
    depends_on:
      - mysql-db
      - redis-cache
      - job-dummy
    networks:
      - admin-console-network

  lineage-beat:
    build:
      context: ./lineage_manager_v2
      dockerfile: deploy/docker/Dockerfile
    image: admin-console/lineage-worker
    container_name: lineage-beat
    command: ["beat"]
    env_file:
      - ./lineage_manager_v2/.env
    environment:
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - REDIS_HOST=redis-cache
      - REDIS_PORT=6379
      - JOB_MANAGER_URL=http://job-dummy:9000
    depends_on:
      - mysql-db
      - redis-cache
      - lineage-worker
    networks:
      - admin-console-network

  # --- Analytics Backend ---
  analytics-api:
    build:
      context: ./analytics_manager
      dockerfile: deploy/docker/Dockerfile
    image: admin-console/analytics-api
    container_name: analytics-api
    ports:
      - "5004:5004"
    env_file:
      - ./analytics_manager/.env
    environment:
      - REDIS_HOST=redis-cache
      - REDIS_PORT=6379
      - LINEAGE_MANAGER_URL=http://lineage-api:5003
      - ROOT_PATH=/admin-console/analytics-manager
      - CORS_ALLOWED_ORIGINS=["http://localhost:5100","http://127.0.0.1:5100","${EXTERNAL_CORS_ORIGIN:-http://localhost:5100}"]
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
      - SECRET_KEY=${SESSION_SECRET_KEY:-magic_word}
    volumes:
      - ~/.config/gcloud:/root/.config/gcloud:ro
    depends_on:
      - redis-cache
    networks:
      - admin-console-network

  # --- Dummy Services ---
  job-dummy:
    build:
      context: ./dummy-job-manager
      dockerfile: Dockerfile
    image: admin-console/job-dummy
    container_name: job-dummy
    ports:
      - "9000:9000"
    volumes:
      - ./dummy-job-manager:/app/data:ro
    networks:
      - admin-console-network

