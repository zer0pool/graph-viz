<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mermaid Job-Only Lineage Viewer</title>
    <!-- Mermaid.js from CDN for portability and zero-setup -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <link rel="stylesheet" href="static/css/viewers/mermaid-viewer.css">
</head>

<body>
    <div id="viewer-root">
        <div id="loading" class="status-overlay">
            <div class="spinner"></div>
            <p>Fetching job lineage data...</p>
        </div>

        <div id="graph-container">
            <div id="mermaid-graph" class="mermaid">
                <!-- Graph will be rendered here -->
            </div>
        </div>

        <div id="error-message" class="error-panel" style="display: none;">
            <p id="error-text"></p>
        </div>
    </div>

    <script type="module" src="static/js/viewers/mermaid-job-viewer.js"></script>
</body>

</html>
