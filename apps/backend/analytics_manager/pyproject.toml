[project]
name = "analytics-manager"
version = "0.1.0"
description = "Production-grade Metrics & Analytics service using GraphQL and CQRS"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "strawberry-graphql[fastapi]>=0.200.0",
    "dependency-injector",
    "pydantic-settings",
    "google-cloud-bigquery",
    "redis",
    "itsdangerous>=2.2.0",
    "sqlalchemy",
    "httpx",
    "python-multipart",
    "celery",
    "black>=26.3.1",
    "isort>=8.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]  # E/F: pycodestyle+pyflakes, I: isort

[tool.ruff.format]
quote-style = "double"
