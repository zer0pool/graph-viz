replicaCount: 2
fullnameOverride: "lineage-manager"

image:
  repository: asia-northeast3-docker.pkg.dev/sec-bdp-user-dev/self-scheduling-dev1/lineage-manager
  pullPolicy: Always
  tag: "latest"

serviceAccount:
  create: false
  name: "self-scheduling"

namespace: "self-scheduling-dev1"

service:
  type: NodePort
  port: 5003
  targetPort: 5003
  # annotations:
  #   cloud.google.com/backend-config: '{"default": "self-scheduling-backend"}'
  #   cloud.google.com/neg: '{"ingress": true}'

livenessProbe:
  httpGet:
    path: /api/v1/graph/health
    port: 5003
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 10
  successThreshold: 1
  timeoutSeconds: 30

readinessProbe:
  httpGet:
    path: /api/v1/graph/health
    port: 5003
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 10
  successThreshold: 1
  timeoutSeconds: 30


resources:
  limits:
    cpu: 3000m
    memory: 4Gi
  requests:
    cpu: 1000m
    memory: 2Gi

cloudSqlProxy:
  enabled: true
  image: "gcr.io/cloudsql-docker/gce-proxy:latest"
  instanceConnectionName: "sec-bdp-dev:asia-northeast3:bdp-d-sql-selfschedule-an3"
  port: 3306

env:
  # Database Settings
  DB_HOST: "127.0.0.1"
  DB_PORT: "3306"
  DB_NAME: "lineage_manager"
  DB_USER: "ss_admin"
  DB_PASSWORD: "Samsungpw1!" # Note: Consider using secrets for production

  # App Settings
  ENV_STATE: "dev"
  LOG_LEVEL: "INFO"
  APP_REQUIRE_AUTHENTICATION: "false"
  APP_JOB_MANAGER_URL: "http://self-scheduling-backend:5001"

  # Redis Settings
  REDIS_ENABLED: "true"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"

  # GCP Settings
  GCP_PROJECT: "sec-bdp-dev"
  GCP_LOCATION: "asia-northeast3"

  # Feature Settings
  FEATURE_HISTORY_TABLE: "sec-bdp.dev.bod_000.fin_history"
  FEATURE_ENABLE_BIGQUERY: "true"
