apiVersion: v1
kind: Service
metadata:
  name: {{ include "lineage-manager.fullname" . }}
  labels:
    {{- include "lineage-manager.labels" . | nindent 4 }}
  {{- if .Values.service.annotations }}
  annotations:
    {{- toYaml .Values.service.annotations | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "lineage-manager.selectorLabels" . | nindent 4 }}
