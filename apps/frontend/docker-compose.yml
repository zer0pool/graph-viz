services:
  frontend-console-app:
    build:
      context: ./container
      dockerfile: deploy/docker/Dockerfile
      args:
        - LINEAGE_MFE_URL=http://localhost:5101/mfe-lineage/remoteEntry.js
        - CATALOG_MFE_URL=http://localhost:5102/mfe-catalog/remoteEntry.js
    container_name: frontend-console-app
    ports:
      - "${SHELL_PORT:-5100}:80"
    environment:
      - API_BASE_URL=/admin-console
      - BASE_URL=${BASE_URL:-/admin-console}
      - BACKEND_HOST=http://lineage-manager:5003
      - LINEAGE_MFE_URL=/admin-console/mfe-lineage/remoteEntry.js
      - CATALOG_MFE_URL=/admin-console/mfe-catalog/remoteEntry.js
      - ENABLE_LINEAGE_MFE=${ENABLE_LINEAGE_MFE:-true}
      - ENABLE_CATALOG_MFE=${ENABLE_CATALOG_MFE:-true}
      - NODE_ENV=production
    depends_on:
      - frontend-mfe-lineage
      - frontend-mfe-catalog
    networks:
      - frontend-network
      - backend-network

  frontend-mfe-lineage:
    build:
      context: ./mfe-lineage
      dockerfile: deploy/docker/Dockerfile
      args:
        - LINEAGE_MFE_URL=http://localhost:5101/mfe-lineage/remoteEntry.js
        - CATALOG_MFE_URL=http://localhost:5102/mfe-catalog/remoteEntry.js
    container_name: frontend-mfe-lineage
    ports:
      - "${LINEAGE_PORT:-5101}:80"
    environment:
      - API_BASE_URL=/admin-console
      - BASE_URL=${LINEAGE_BASE_URL:-/mfe-lineage}
      - BACKEND_HOST=http://lineage-manager:5003
    networks:
      - frontend-network
      - backend-network

  frontend-mfe-catalog:
    build:
      context: ./mfe-catalog
      dockerfile: deploy/docker/Dockerfile
      args:
        - LINEAGE_MFE_URL=http://localhost:5101/mfe-lineage/remoteEntry.js
        - CATALOG_MFE_URL=http://localhost:5102/mfe-catalog/remoteEntry.js
    container_name: frontend-mfe-catalog
    ports:
      - "${TABLE_DETAIL_PORT:-5102}:80"
    environment:
      - API_BASE_URL=/admin-console
      - BASE_URL=${CATALOG_BASE_URL:-/mfe-catalog}
      - BACKEND_HOST=http://lineage-manager:5003
    networks:
      - frontend-network
      - backend-network

networks:
  frontend-network:
    driver: bridge
  backend-network:
    name: lineage-platform-network
    driver: bridge
