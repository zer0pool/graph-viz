

services:
  shell:
    build:
      context: ./container
      dockerfile: deploy/docker/Dockerfile
      args:
        - LINEAGE_MFE_URL=/admin-console/mfe-lineage/remoteEntry.js
        - CATALOG_MFE_URL=/admin-console/mfe-catalog/remoteEntry.js
    image: admin-console/shell
    container_name: shell
    ports:
      - "5100:80"
    environment:
      - BASE_URL=/admin-console
      - BACKEND_HOST=http://lineage-api:5003
      - LINEAGE_MANAGER_UPSTREAM=http://lineage-api:5003
      - ANALYTICS_MANAGER_UPSTREAM=http://analytics-api:5004
      - MFE_LINEAGE_UPSTREAM=http://ui-lineage:80
      - MFE_CATALOG_UPSTREAM=http://ui-catalog:80
      - NAMESERVER=127.0.0.11
      - NODE_ENV=production
      - REQUIRE_SIGNIN=true
      - REST_API_DOCS_URL=http://localhost:5100/admin-console/docs
      - GRAPHQL_API_DOCS_URL=http://localhost:5100/admin-console/analytics-manager/graphql
    depends_on:
      - ui-lineage
      - ui-catalog
      - lineage-api
    networks:
      - admin-console-network

  ui-lineage:
    build:
      context: ./mfe-lineage
      dockerfile: deploy/docker/Dockerfile
    image: admin-console/ui-lineage
    container_name: ui-lineage
    ports:
      - "5101:80"
    environment:
      - BASE_URL=/admin-console/mfe-lineage
      - BACKEND_HOST=http://lineage-api:5003
    networks:
      - admin-console-network

  ui-catalog:
    build:
      context: ./mfe-catalog
      dockerfile: deploy/docker/Dockerfile
    image: admin-console/ui-catalog
    container_name: ui-catalog
    ports:
      - "5102:80"
    environment:
      - BASE_URL=/admin-console/mfe-catalog
      - BACKEND_HOST=http://lineage-api:5003
    networks:
      - admin-console-network

