<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workflow Graph Viewer</title>

    <!-- favicon -->
    <link rel="icon" type="image/png" href="/static/images/logo.png">

    <!-- CSS -->
    <link rel="stylesheet" href="/static/css/modern-console.css">

    <!-- Cytoscape -->
    <script src="https://unpkg.com/cytoscape@3.26.0/dist/cytoscape.min.js"></script>
    <script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
    <script src="https://unpkg.com/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>
    <script src="/static/js/plugins/cytoscape-minimap.js"></script>
</head>

<body>
    <div id="navbar">
        <div class="logo-area">
            <img src="/static/images/logo.png" alt="Logo" class="logo">
            <h2>Workflow Graph Viewer</h2>
        </div>
        <div class="search-bar">
            <input type="text" id="jobId" placeholder="Search Job ID">
            <button id="loadBtn" type="button">
                <svg xmlns="http://www.w3.org/2000/svg" class="icon" viewBox="0 0 24 24">
                    <path fill="currentColor"
                        d="M9.5 3a6.5 6.5 0 014.9 10.6l4 4a1 1 0 01-1.4 1.4l-4-4A6.5 6.5 0 119.5 3zm0 2a4.5 4.5 0 100 9 4.5 4.5 0 000-9z" />
                </svg>
            </button>
        </div>
    </div>

    <div id="main">
        <div id="cy"></div>

        <!-- ✅ 줌 컨트롤 -->
        <div id="zoom-controls">
            <button id="zoom-in" title="Zoom In">＋</button>
            <span id="zoom-level">100%</span>
            <button id="zoom-out" title="Zoom Out">－</button>
            <button id="fit" title="Fit">⤢</button>
        </div>

        <div id="side-panel">
            <h3>
                Node Details
                <button id="close-panel" type="button">&times;</button>
            </h3>
            <div id="node-info">Click a node to view details</div>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
</body>

</html>
