<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workflow Graph Viewer</title>

    <!-- 스타일 -->
    <link rel="stylesheet" href="/static/css/modern-console.css">
    <link rel="icon" href="/static/images/logo.png">

    <!-- Cytoscape.js 및 플러그인 -->
    <script src="https://unpkg.com/cytoscape@3.26.0/dist/cytoscape.min.js"></script>
    <script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
    <script src="https://unpkg.com/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>
    <script src="/static/js/plugins/cytoscape-minimap.js"></script>

</head>

<body>
    <div id="navbar">
        <div style="display:flex; align-items:center; gap:10px;">
            <img src="/static/images/logo.png" alt="Logo" style="height:32px; width:auto;">
            <h2>Workflow Graph Viewer</h2>
        </div>
        <div id="search-bar">
            <!-- 회색 돋보기 SVG 아이콘 -->
            <svg id="search-icon" viewBox="0 0 16 16">
                <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001l3.85 3.85a1 1 0 0 0 
      1.415-1.415l-3.85-3.85zm-5.242.656a5 5 0 1 1 
      0-10 5 5 0 0 1 0 10z"></path>
            </svg>

            <input type="text" id="jobId" placeholder="Search job ID..." />
            <button id="loadBtn">Load</button>
        </div>
    </div>

    <div id="main">
        <div id="cy"></div>
        <div id="zoom-controls">
            <button id="zoom-in">+</button>
            <span id="zoom-level">100%</span>
            <button id="zoom-out">−</button>
        </div>

        <div id="side-panel">
            <h3>
                Workflow Details
                <button id="close-panel" title="Close panel">&times;</button>
            </h3>
            <div id="controls">
                <button id="reloadBtn">Reload</button>
                <button id="fitBtn">Fit</button>
            </div>
            <div id="node-info">Click a node to view details</div>
        </div>
    </div>
    <script src="/static/js/main.js"></script>
</body>

</html>
